version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      pocketbase:
        patterns: ["ganigeorgiev.com/pocketbase/*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: gomod
    directory: /e2e/pocketbase
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
